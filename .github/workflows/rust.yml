name: Rust

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/realpeep-core -> target

      - name: Format
        working-directory: rust/realpeep-core
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust/realpeep-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rust/realpeep-core
        run: cargo test
